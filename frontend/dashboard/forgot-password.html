<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Nova Braille — parola sıfırlama.">
    <meta name="robots" content="noindex, nofollow">
    <title>Parolamı Unuttum — Nova Braille</title>
    <link rel="stylesheet" href="../shared/css/tokens.css">
    <link rel="stylesheet" href="../shared/css/prefs.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <script src="../shared/js/preferences.js"></script>
</head>
<body class="auth-page">
    <main id="main-content">
        <div class="auth-card">
            <a href="../public/index.html" class="logo">Nova Braille</a>
            <h1>Parolamı Unuttum</h1>
            <p class="auth-subtitle">E-posta adresinizi girin, size parola sıfırlama bağlantısı gönderelim.</p>

            <form id="forgot-form" class="stack" novalidate>
                <div class="form-field">
                    <label for="email">E-posta Adresi</label>
                    <input type="email" id="email" name="email" required autocomplete="email" aria-required="true">
                </div>
                <button type="submit" class="btn btn-primary" id="forgot-submit">Bağlantı Gönder</button>
            </form>

            <p id="forgot-status" class="status-message" role="status" aria-live="polite"></p>

            <div class="auth-links">
                <a href="login.html">Giriş sayfasına dön</a>
            </div>
        </div>
    </main>
    <script src="../shared/js/api.js" defer></script>
    <script src="../shared/js/ui.js" defer></script>
    <script src="js/forgot-password.js" defer></script>
</body>
</html>

# Docker Compose — Geliştirme Ortamı
#
# Kullanım:
#   docker compose -f deploy/docker-compose.dev.yml up -d
#
# PostgreSQL ve Redis servislerini başlatır.
# Uygulama sunucuda doğrudan çalışır (uv run uvicorn), konteyner içinde değil.

services:
  db:
    image: postgres:16-alpine
    container_name: novabraille-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: novabraille
      POSTGRES_PASSWORD: ***
      POSTGRES_DB: novabraille_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novabraille -d novabraille_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: novabraille-dev-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata-dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata-dev:
    driver: local
  redisdata-dev:
    driver: local